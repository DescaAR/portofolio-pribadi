name: Build portfolio assets

on:
  push:
    branches:
      - gh-pages
    paths-ignore:
      - cv-desca-affajry-rais.pdf
      - og-image.jpg
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser and image dependencies
        run: |
          npm install playwright
          npx playwright install --with-deps chromium
          python -m pip install --upgrade pip
          python -m pip install pillow

      - name: Start local portfolio server
        run: |
          REPO_DIR="$(basename "$GITHUB_WORKSPACE")"
          PARENT_DIR="$(dirname "$GITHUB_WORKSPACE")"
          nohup python3 -m http.server 8000 --directory "$PARENT_DIR" >/tmp/portfolio-http.log 2>&1 &
          echo "PORTFOLIO_CV_URL=http://127.0.0.1:8000/$REPO_DIR/cv.html" >> "$GITHUB_ENV"
          sleep 2

      - name: Generate downloadable CV PDF
        run: |
          cat > /tmp/generate-cv.mjs <<'EOF'
          import { chromium } from 'playwright';

          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1440, height: 1200 } });
          await page.goto(process.env.PORTFOLIO_CV_URL, { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.emulateMedia({ media: 'print' });
          await page.evaluate(async () => {
            if (document.fonts?.ready) await document.fonts.ready;
          });
          await page.waitForTimeout(1200);
          await page.pdf({
            path: 'cv-desca-affajry-rais.pdf',
            format: 'A4',
            printBackground: true,
            preferCSSPageSize: true,
            margin: { top: '0mm', right: '0mm', bottom: '0mm', left: '0mm' }
          });
          await browser.close();
          EOF
          node /tmp/generate-cv.mjs

      - name: Generate social preview image
        run: |
          python <<'PY'
          from PIL import Image, ImageDraw, ImageFont

          W, H = 1200, 630
          top = (7, 24, 47)
          bottom = (22, 78, 146)

          img = Image.new("RGB", (W, H))
          px = img.load()
          for y in range(H):
              t = y / max(H - 1, 1)
              r = round(top[0] * (1 - t) + bottom[0] * t)
              g = round(top[1] * (1 - t) + bottom[1] * t)
              b = round(top[2] * (1 - t) + bottom[2] * t)
              for x in range(W):
                  px[x, y] = (r, g, b)

          draw = ImageDraw.Draw(img, "RGBA")

          # Soft academic-blue glows.
          for cx, cy, radius, alpha in [(995, 95, 300, 32), (1050, 560, 260, 18), (120, 40, 250, 14)]:
              for rr in range(radius, 0, -8):
                  a = int(alpha * (rr / radius) ** 2)
                  draw.ellipse((cx-rr, cy-rr, cx+rr, cy+rr), fill=(88, 177, 255, a))

          # Subtle mathematical grid.
          for x in range(0, W, 48):
              draw.line((x, 0, x, H), fill=(255,255,255,10), width=1)
          for y in range(0, H, 48):
              draw.line((0, y, W, y), fill=(255,255,255,10), width=1)

          font_bold = "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
          font_reg = "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"
          title = ImageFont.truetype(font_bold, 66)
          subtitle = ImageFont.truetype(font_reg, 31)
          eyebrow = ImageFont.truetype(font_bold, 19)
          small = ImageFont.truetype(font_reg, 22)

          # Logo card.
          logo = Image.open("portfolio-logo.jpg").convert("RGB")
          side = min(logo.size)
          left = (logo.width-side)//2
          top_crop = (logo.height-side)//2
          logo = logo.crop((left, top_crop, left+side, top_crop+side)).resize((104,104), Image.Resampling.LANCZOS)
          draw.rounded_rectangle((76,72,204,200), radius=28, fill=(255,255,255,235))
          img.paste(logo, (88,84))

          draw.text((76, 250), "MATHEMATICS · RESEARCH · EDUCATION", font=eyebrow, fill=(150, 211, 255))
          draw.text((76, 292), "Desca Affajry Rais", font=title, fill=(255,255,255))
          draw.text((78, 382), "Academic & Professional Portfolio", font=subtitle, fill=(214,230,248))
          draw.text((78, 447), "Pure mathematics · Graph theory · Topology · Teaching · Data", font=small, fill=(180,204,229))

          # Footer line.
          draw.line((76, 528, 1124, 528), fill=(255,255,255,34), width=1)
          draw.text((78, 554), "descaar.github.io/portofolio-pribadi", font=small, fill=(150,190,231))

          img.save("og-image.jpg", "JPEG", quality=92, optimize=True, progressive=True)
          PY

      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cv-desca-affajry-rais.pdf og-image.jpg
          if git diff --cached --quiet; then
            echo "Generated assets are unchanged."
            exit 0
          fi
          git commit -m "Generate CV PDF and social preview [skip ci]"
          git push origin HEAD:gh-pages
