<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Page Not Found | Desca Affajry Rais</title>
  <meta name="robots" content="noindex,follow">
  <meta name="theme-color" content="#06172f">
  <link rel="icon" type="image/png" href="/portofolio-pribadi/favicon.png">
  <script>try{document.documentElement.dataset.theme=localStorage.getItem('portfolio-theme')||'light'}catch(_){}</script>
  <style>
    *{box-sizing:border-box}
    :root{--bg1:#f8fbff;--bg2:#e9f2fb;--ink:#0a1f44;--muted:#586a82;--panel:rgba(255,255,255,.82);--line:rgba(44,92,151,.14);--blue:#2467d6}
    [data-theme="dark"]{--bg1:#07111f;--bg2:#0d213b;--ink:#f4f8fd;--muted:#b3c3d6;--panel:rgba(13,29,49,.86);--line:rgba(137,174,217,.15);--blue:#67b2ff}
    body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 80% 20%,color-mix(in srgb,var(--blue) 16%,transparent),transparent 24rem),linear-gradient(180deg,var(--bg1),var(--bg2));color:var(--ink);min-height:100vh;display:grid;place-items:center;padding:24px}
    .theme{position:fixed;top:18px;right:18px;width:44px;height:44px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);font:inherit;font-weight:800;cursor:pointer;backdrop-filter:blur(12px)}
    .wrap{width:min(720px,100%);text-align:center;padding:54px 28px;border:1px solid var(--line);border-radius:26px;background:var(--panel);box-shadow:0 24px 70px rgba(7,31,68,.10);backdrop-filter:blur(14px)}
    [data-theme="dark"] .wrap{box-shadow:0 28px 74px rgba(0,0,0,.28)}
    .mark{width:58px;height:58px;border-radius:16px;object-fit:cover;margin-bottom:22px;box-shadow:0 10px 28px rgba(7,31,68,.14)}
    .code{font-size:.75rem;font-weight:850;letter-spacing:.16em;color:var(--blue);text-transform:uppercase}
    h1{font-size:clamp(2.25rem,7vw,4.25rem);line-height:1;letter-spacing:-.055em;margin:12px 0 18px}
    p{color:var(--muted);line-height:1.75;max-width:560px;margin:0 auto 28px}
    a{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 20px;border-radius:12px;background:linear-gradient(135deg,#2467d6,#3379df);color:#fff;text-decoration:none;font-weight:800;box-shadow:0 12px 28px rgba(36,103,214,.18)}
    [data-theme="dark"] a{background:linear-gradient(135deg,#4b8fe8,#67b2ff);color:#06172f}
    :where(a,button):focus-visible{outline:3px solid #58a6ff;outline-offset:3px}
    @media(max-width:430px){.wrap{padding:40px 20px;border-radius:20px}.theme{top:12px;right:12px}}
  </style>
</head>
<body>
  <button class="theme" id="theme" type="button" aria-label="Toggle theme">◐</button>
  <main class="wrap">
    <img class="mark" src="/portofolio-pribadi/portfolio-logo.jpg" alt="">
    <div class="code">404 · Page not found</div>
    <h1>This page doesn't exist.</h1>
    <p>The address may have changed, or the page may no longer be available. Return to the portfolio to continue exploring my work.</p>
    <a href="/portofolio-pribadi/">Back to Portfolio →</a>
  </main>
  <script>
    const btn=document.getElementById('theme');
    function sync(){const dark=document.documentElement.dataset.theme==='dark';btn.textContent=dark?'☀':'◐';btn.setAttribute('aria-label',dark?'Use light theme':'Use dark theme')}
    btn.addEventListener('click',()=>{const next=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=next;localStorage.setItem('portfolio-theme',next);sync()});
    sync();
  </script>
</body>
</html>
