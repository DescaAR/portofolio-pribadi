<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Page Not Found | Desca Affajry Rais</title>
  <meta name="robots" content="noindex,follow">
  <meta name="theme-color" content="#06172f">
  <link rel="icon" type="image/png" href="/portofolio-pribadi/favicon.png">
  <script>try{document.documentElement.dataset.theme=localStorage.getItem('portfolio-theme')||'light'}catch(_){}</script>
  <style>
    *{box-sizing:border-box}
    :root{--bg1:#f8fbff;--bg2:#e9f2fb;--ink:#0a1f44;--muted:#586a82;--panel:rgba(255,255,255,.72);--line:rgba(44,92,151,.13);--blue:#2467d6}
    [data-theme="dark"]{--bg1:#07111f;--bg2:#0d213b;--ink:#f4f8fd;--muted:#b3c3d6;--panel:rgba(13,29,49,.58);--line:rgba(137,174,217,.13);--blue:#67b2ff}
    html,body{min-height:100%}
    body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 82% 20%,color-mix(in srgb,var(--blue) 13%,transparent),transparent 24rem),linear-gradient(180deg,var(--bg1),var(--bg2));color:var(--ink);min-height:100vh}
    .top{height:68px;display:flex;align-items:center;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--panel) 88%,transparent);backdrop-filter:blur(16px)}
    .topin{width:min(1180px,calc(100% - 40px));margin:auto;display:flex;align-items:center;justify-content:space-between;gap:20px}
    .brand{display:flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none;font-weight:850;letter-spacing:-.025em}.brand img{width:35px;height:35px;border-radius:9px;object-fit:cover}
    .theme{width:42px;height:38px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);font:inherit;font-weight:800;cursor:pointer}
    main{min-height:calc(100vh - 68px);display:grid;place-items:center;padding:56px 24px}
    .wrap{width:min(720px,100%);text-align:center;padding:44px 28px;border-top:1px solid var(--line)}
    .code{font-size:.74rem;font-weight:850;letter-spacing:.16em;color:var(--blue);text-transform:uppercase}
    h1{font-size:clamp(2.35rem,7vw,4.5rem);line-height:.98;letter-spacing:-.06em;margin:13px 0 18px}
    p{color:var(--muted);line-height:1.8;max-width:570px;margin:0 auto 28px}
    .actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
    .btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 19px;border-radius:11px;text-decoration:none;font-weight:800}
    .primary{background:linear-gradient(135deg,#2467d6,#3379df);color:#fff;box-shadow:0 12px 28px rgba(36,103,214,.16)}
    .secondary{border:1px solid var(--line);background:var(--panel);color:var(--ink)}
    [data-theme="dark"] .primary{background:linear-gradient(135deg,#4b8fe8,#67b2ff);color:#06172f}
    :where(a,button):focus-visible{outline:3px solid #58a6ff;outline-offset:3px}
    @media(max-width:520px){.topin{width:min(100% - 28px,1180px)}.brand span{display:none}.wrap{padding:36px 8px}.actions{flex-direction:column}.btn{width:100%}}
  </style>
</head>
<body>
  <header class="top"><div class="topin"><a class="brand" href="/portofolio-pribadi/"><img src="/portofolio-pribadi/portfolio-logo.jpg" alt=""><span>Desca Affajry Rais</span></a><button class="theme" id="theme" type="button" aria-label="Toggle theme">◐</button></div></header>
  <main>
    <section class="wrap">
      <div class="code">404 · Page not found</div>
      <h1>This page doesn't exist.</h1>
      <p>The address may have changed, or the page may no longer be available. Return to the portfolio or continue to the publications section.</p>
      <div class="actions"><a class="btn primary" href="/portofolio-pribadi/">Back to Portfolio →</a><a class="btn secondary" href="/portofolio-pribadi/publications/">Publications</a></div>
    </section>
  </main>
  <script>
    const btn=document.getElementById('theme');
    function sync(){const dark=document.documentElement.dataset.theme==='dark';btn.textContent=dark?'☀':'◐';btn.setAttribute('aria-label',dark?'Use light theme':'Use dark theme')}
    btn.addEventListener('click',()=>{const next=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=next;localStorage.setItem('portfolio-theme',next);sync()});
    sync();
  </script>
</body>
</html>
